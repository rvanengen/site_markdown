[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-markdown"
version = "0.1.0"
description = "Crawl a website section into a single Markdown document"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "markdownify>=0.13,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
site-markdown = "site_markdown.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
